[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-snatcher"
version = "0.1.0"
description = "Extract and install Claude Code skills from Instagram reels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0",
    "requests>=2.28",
]

[project.scripts]
skill-snatcher = "skill_snatcher.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
